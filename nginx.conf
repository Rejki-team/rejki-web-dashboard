# ─────────────────────────────────────────────────────────────────────────────
# Rejki Web Dashboard — Nginx config (container internal)
# Serve static files + proxy /api ke rejki-app backend
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                   always;
    add_header X-Frame-Options         "DENY"                      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── API proxy ────────────────────────────────────────────────────────────
    # Semua request /api/ diteruskan ke rejki-app backend
    location /api/ {
        proxy_pass         http://rejki-app:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Semua route selain file static dan /api/ → index.html (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
