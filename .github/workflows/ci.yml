name: CI + Deploy

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rejki-web

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Type check (vue-tsc) ─────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check (vue-tsc)
        run: bun run typecheck

  # ── Lint (ESLint) ───────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (ESLint)
        run: bun run lint:check

  # ── Test (Vitest) ───────────────────────────────────────────────────────
  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test

  # ── Build (production bundle verification) ───────────────────────────────
  build:
    name: Build (verify)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production bundle
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_MAX_EVIDENCE_BYTES: "5242880"
        run: bun run build

  # ── Docker Build & Push ─────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR HANYA terima lowercase — "Rejki-team" → "rejki-team"
      - name: Lowercase owner
        id: lc
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/rejki-web
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_MAX_EVIDENCE_BYTES=5242880
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy Dev (develop only) ───────────────────────────────────────────
  deploy-dev:
    name: Deploy to VPS (dev)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "==> Login to GitHub Container Registry"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pull latest web image"
            docker compose -f /opt/rejki/dev/docker-compose.dev.yml --env-file /opt/rejki/dev/.env pull rejki-web

            echo "==> Restart rejki-web service"
            docker compose -f /opt/rejki/dev/docker-compose.dev.yml --env-file /opt/rejki/dev/.env up -d rejki-web

            echo "==> Verify"
            docker compose -f /opt/rejki/dev/docker-compose.dev.yml --env-file /opt/rejki/dev/.env ps rejki-web

            echo "==> Prune old images"
            docker image prune -f

            echo "✅ Web dev deploy complete"

  # ── Deploy Prod (main only) ────────────────────────────────────────────
  deploy-prod:
    name: Deploy to VPS (prod)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "==> Login to GitHub Container Registry"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pull latest web image"
            docker compose -f /opt/rejki/prod/docker-compose.prod.yml --env-file /opt/rejki/prod/.env pull rejki-web

            echo "==> Restart rejki-web service"
            docker compose -f /opt/rejki/prod/docker-compose.prod.yml --env-file /opt/rejki/prod/.env up -d rejki-web

            echo "==> Verify"
            docker compose -f /opt/rejki/prod/docker-compose.prod.yml --env-file /opt/rejki/prod/.env ps rejki-web

            echo "==> Prune old images"
            docker image prune -f

            echo "✅ Web production deploy complete"
