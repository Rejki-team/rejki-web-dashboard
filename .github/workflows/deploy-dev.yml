name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-web-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy to VPS (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            cd /opt/rejki/dev/rejki-web

            echo "==> Pull latest develop"
            git pull origin develop

            echo "==> Rebuild & restart rejki-web service"
            docker compose -f /opt/rejki/dev/rejki-backend/docker-compose.dev.yml -p rejki-dev build rejki-web
            docker compose -f /opt/rejki/dev/rejki-backend/docker-compose.dev.yml -p rejki-dev up -d rejki-web

            echo "==> Cleanup old images"
            docker image prune -f

            echo "==> Dev deploy complete"
